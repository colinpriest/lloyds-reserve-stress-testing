[pytest]
# Default collection: the offline novelty/unit suites plus the integration scripts in
# tests/ (which skip cleanly when their optional SDKs, credentials or source PDFs are
# absent). Without testpaths, pytest at the repo root crawls .conda -- a vendored
# environment holding thousands of site-packages test files -- and the multi-thousand-
# file data trees, so collection hangs before it ever errors.
testpaths =
    scripts/stress_test/novelty/tests
    tests
norecursedirs = .conda pdf_extraction syndicate_reports lloyds_data results tmp
    __pycache__ .git .cursor .codex
